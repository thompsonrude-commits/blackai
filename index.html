  <body>
    <div id="root"></div>
    <!-- model-viewer loaded lazily to avoid blocking main thread -->
    <script>
      // ── Force clear ALL old service workers and caches ──────────────────
      // This runs on every page load and guarantees the latest code is served.
      if ('serviceWorker' in navigator) {
        // Unregister every old service worker first
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
            console.log('[SW] Unregistered old service worker:', reg.scope);
          }
        });

        // Clear every cache
        if ('caches' in window) {
          caches.keys().then(function(cacheNames) {
            cacheNames.forEach(function(cacheName) {
              caches.delete(cacheName);
              console.log('[SW] Cleared cache:', cacheName);
            });
          });
        }

        // Re-register fresh service worker after a short delay
        window.addEventListener('load', function() {
          setTimeout(function() {
            navigator.serviceWorker.register('/sw.js?v=2.3.0')
              .then(function(registration) {
                console.log('✅ Service Worker registered:', registration.scope);
                // Force immediate activation
                if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              })
              .catch(function(error) {
                console.warn('Service Worker registration failed (non-critical):', error);
              });
          }, 1000);
        });
      }

      // PWA Install Prompt
      var deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        deferredPrompt = null;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
